<!DOCTYPE html>
<html lang="es">
<link rel="stylesheet" href="style.css">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dalain Taxi</title>
  <style>
<script src="app.js"></script>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      text-align: center;
      padding: 25px;
      margin: 0;
    }
    .contenedor {
      background: white;
      padding: 25px;
      border-radius: 15px;
      max-width: 400px;
      margin: 35px auto;
      box-shadow: 0 4px 12px #0002;
    }
    h1 { color: #087f8c; }
    button {
      display: block;
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      background: #087f8c;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }
    #mensaje { margin-top: 20px; }
  </style>
</head>
<body>
  <div class="contenedor">
    <h1>DALAIN TAXI</h1>
    <p>Transporte para Santa Clara, Cuba</p>

    <button onclick="elegir('Pasajero')">Pasajero</button>
    <button onclick="elegir('Chófer')">Chófer</button>

    <p id="mensaje">Selecciona cómo deseas entrar.</p>
  </div>

  <script>
    function elegir(tipo) {
      document.getElementById("mensaje").textContent =
        "Has seleccionado: " + tipo +
        ". Próximamente podrás continuar.";
    }
  </script>
</body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</html>
